<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App</title>
</head>
<body>
    <form method="post" action="/predict">
        <input type="number" step="0.01" name="sepal_length" required><br>
        <input type="number" step="0.01" name="sepal_width" required><br>
        <input type="number" step="0.01" name="petal_length" required><br>
        <input type="number" step="0.01" name="petal_width" required><br>
        <button type="submit">predict Flower</button>
    </form>
    <h1>predicted species:{{prediction}}</h1>
</body>
</html>
